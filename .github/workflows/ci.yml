name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint, Import smoke-test & Pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Prometheus/requirements.txt

      # ── Install dependencies ─────────────────────────────────────────────
      # MetaTrader5 is Windows-only and not required for unit tests.
      # OpenCV headless and Gradio pull heavy optional deps; skip for CI speed.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas numpy scipy ta scikit-learn xgboost lightgbm joblib \
            Pillow matplotlib mplfinance plotly \
            fastapi "uvicorn[standard]" python-multipart aiofiles \
            streamlit sqlalchemy "pydantic>=2.0.0" python-dotenv \
            pytest pytest-asyncio httpx ruff

      # ── Repository-wide static safety gates ─────────────────────────────
      - name: Compile all Python modules
        run: python -m compileall -q Prometheus

      - name: Critical static analysis
        # trader.py has separately tracked execution-path F821 findings that
        # require characterization before correction; do not change live
        # behavior merely to satisfy lint. Syntax is still covered by compileall.
        run: ruff check Prometheus --select E9,F63,F7,F82 --exclude Prometheus/live_bot/trader.py

      # ── Import smoke test ────────────────────────────────────────────────
      # Verifies that core modules can be imported without path injection issues
      # and that there are no syntax errors across the critical import surface.
      - name: Import smoke test
        working-directory: Prometheus
        run: |
          python -c "from config import CONFIG; print('config OK')"
          python -c "from storage.database import init_db; print('database OK')"
          python -c "from analysis.confluence_scorer import ConfluenceScorer; print('confluence_scorer OK')"
          python -c "from prometheus_core import Prometheus, EngineCompleteness; print('prometheus_core OK')"

      # ── Unit tests ───────────────────────────────────────────────────────
      - name: Run unit tests
        working-directory: Prometheus
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/Prometheus
